# FlowBuilder 서버 주기 작업 (9단계)
# 5분마다 /api/cron 을 불러 예약 실행(Schedule)을 시작하고, 아무도 보고 있지 않은 실행을 이어서 진행한다.
# 설정 필요 없음. (선택) 서버에 CRON_SECRET 을 넣었다면 저장소 Secret FLOWBUILDER_CRON_SECRET 에 같은 값을 넣는다.
# 알아둘 것: GitHub 예약은 몇 분 늦을 수 있고, 저장소에 60일 동안 변경이 없으면 GitHub가 예약을 멈춘다.
name: FlowBuilder tick

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/cron
        env:
          CRON_SECRET: ${{ secrets.FLOWBUILDER_CRON_SECRET }}
        run: |
          if [ -n "$CRON_SECRET" ]; then
            curl -fsS -X POST -H "Authorization: Bearer $CRON_SECRET" https://flowbuilder-roan.vercel.app/api/cron
          else
            curl -fsS -X POST https://flowbuilder-roan.vercel.app/api/cron
          fi
